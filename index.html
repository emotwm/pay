<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>倚盟請款簽核</title>
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700;900&display=swap">
<style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<style>
/* 版面：請款系統自己的「帳簿藍」配色與原本的明體標題，刻意跟公告簽收系統（綠色）分開。手機優先單欄：上方切換「申請人／老闆審核」，
   下方是請款單列表；點開一張就是一張「請款單」紙本樣式，底部三格：申請人・核准・付款。
   顏色固定意思：黃＝等老闆、紫＝核准待付款、綠＝已付款、紅＝退回。 */
:root{
  --bg:#EEF0F6; --surface:#FFFFFF; --surface-2:#F3F4F9; --ink:#161B33; --muted:#5A6078; --line:#D5D8E6;
  --accent:#2E3F94; --accent-ink:#FFFFFF; --accent-soft:#E1E5F6;
  --band:#1F2A6B; --band-ink:#FFFFFF; --band-muted:#B9C0E6; --gold:#D4A23A;
  --seal:#B8322A; --seal-soft:#F8E2DF;
  --ok:#1D7350; --ok-soft:#DCF0E5; --info:#7A3FA8; --info-soft:#EFE4F7; --warn:#8A5A00; --warn-soft:#FAEDCB;
  --paper:#FFFFFF; --paper-ink:#14251F; --paper-line:#CDD1E0; --scrim:rgba(10,20,16,.82);
  --display:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10131F; --surface:#181C2C; --surface-2:#1F2436; --ink:#E7E9F3; --muted:#9BA0B8; --line:#2D3350;
    --accent:#9DAEFF; --accent-ink:#0E1433; --accent-soft:#232B52;
    --band:#1B2350; --band-ink:#F2F3FA; --band-muted:#A9B1DC; --gold:#D4A23A;
    --seal:#F07363; --seal-soft:#3A1C18;
    --ok:#5BC98D; --ok-soft:#15301F; --info:#C79BEF; --info-soft:#2E2140; --warn:#E6B54E; --warn-soft:#382C10;
    --paper:#F7F9F8; --paper-ink:#14251F; --paper-line:#CDD1E0; --scrim:rgba(0,0,0,.86); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10131F; --surface:#181C2C; --surface-2:#1F2436; --ink:#E7E9F3; --muted:#9BA0B8; --line:#2D3350;
  --accent:#9DAEFF; --accent-ink:#0E1433; --accent-soft:#232B52;
  --band:#1B2350; --band-ink:#F2F3FA; --band-muted:#A9B1DC; --gold:#D4A23A;
  --seal:#F07363; --seal-soft:#3A1C18;
  --ok:#5BC98D; --ok-soft:#15301F; --info:#C79BEF; --info-soft:#2E2140; --warn:#E6B54E; --warn-soft:#382C10;
  --paper:#F7F9F8; --paper-ink:#14251F; --paper-line:#CDD1E0; --scrim:rgba(0,0,0,.86); color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.65}
.app{max-width:880px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 56px;display:flex;flex-direction:column;gap:16px}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;background:var(--band);color:var(--band-ink);border-radius:var(--r);padding:14px 16px;border-bottom:4px solid var(--gold)}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0;flex-wrap:wrap}
.brand b{font-family:var(--display);font-weight:900;font-size:21px;letter-spacing:.05em}
.brand span{color:var(--band-muted);font-size:13px}
.switch{display:flex;border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:3px;background:rgba(255,255,255,.1)}
.switch button{border:0;background:transparent;color:var(--band-muted);font:inherit;font-size:15px;padding:8px 16px;border-radius:999px;cursor:pointer}
.switch button[aria-pressed="true"]{background:var(--gold);color:#1B1A10;font-weight:700}
.note{font-size:13px;color:var(--warn);background:var(--warn-soft);border-radius:var(--r);padding:8px 12px}
button:focus-visible,select:focus-visible,canvas:focus-visible,input:focus-visible,textarea:focus-visible,.card:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1{font-family:var(--display);font-weight:900;font-size:24px;line-height:1.35;margin:0;text-wrap:balance}
h2{font-family:var(--display);font-weight:700;font-size:18px;margin:0;text-wrap:balance}
.eyebrow{font-size:12px;letter-spacing:.14em;color:var(--accent);font-weight:700}
.muted{color:var(--muted)} .small{font-size:13px}
.num{font-variant-numeric:tabular-nums}
.narrow{max-width:520px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grow{flex:1 1 auto}
.btn{font:inherit;font-weight:700;font-size:16px;border-radius:var(--r);border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);padding:11px 18px;cursor:pointer;min-height:48px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.quiet{background:transparent;color:var(--accent)}
.btn.danger{background:var(--seal);border-color:var(--seal);color:#fff}
.btn.dangerq{background:transparent;border-color:var(--seal);color:var(--seal)}
.btn.sm{font-size:14px;min-height:40px;padding:7px 14px}
.link{font:inherit;background:none;border:0;color:var(--accent);padding:6px 0;cursor:pointer;font-weight:700}
label.f{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:700;min-width:0}
label.f .hint{font-weight:400;color:var(--muted);font-size:12px}
input[type=text],input[type=password],input[type=date],input[type=number],input[type=search],select,textarea{font:inherit;font-weight:400;font-size:16px;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%;min-width:0}
textarea{min-height:84px;resize:vertical}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:560px){.grid2{grid-template-columns:1fr}}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:999px;padding:7px 14px;cursor:pointer}
.seg button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:700}
.check{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px}
.check input{width:20px;height:20px;accent-color:var(--seal)}
.err{color:var(--seal);font-weight:700;font-size:14px}
.okmsg{color:var(--ok);font-weight:700;font-size:14px}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tabs button{font:inherit;font-size:15px;background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);padding:10px 14px;cursor:pointer;margin-bottom:-1px}
.tabs button[aria-pressed="true"]{color:var(--ink);font-weight:700;border-bottom-color:var(--accent)}
.who{margin-left:auto;align-self:center;font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center}

.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.info{background:var(--info-soft);color:var(--info)}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.seal{background:var(--seal-soft);color:var(--seal)}
.pill.muted{background:var(--surface-2);color:var(--muted)}
.urgent{font-size:12px;font-weight:900;color:#fff;background:var(--seal);border-radius:4px;padding:1px 7px;letter-spacing:.1em}
.demo{font-size:11px;font-weight:700;color:var(--muted);border:1px dashed var(--line);border-radius:4px;padding:0 6px}

.list{display:flex;flex-direction:column;gap:10px}
.card{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%}
.card:hover{border-color:var(--accent)}
.card .t{font-weight:700;font-size:16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;min-width:0}
.card .a{font-weight:700;font-size:18px;text-align:right;font-variant-numeric:tabular-nums}
.card .m{font-size:13px;color:var(--muted);min-width:0;overflow-wrap:anywhere}
.card .s{text-align:right}
.empty{padding:28px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}
.sum{display:flex;flex-wrap:wrap;gap:10px}
.sum div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;flex:1 1 150px}
.sum b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.sum span{font-size:13px;color:var(--muted)}

.thumbs{display:flex;flex-wrap:wrap;gap:10px}
.thumb{position:relative;width:96px;height:96px;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:var(--surface-2);padding:0;cursor:pointer}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .x{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;border:0;background:var(--scrim);color:#fff;font-size:15px;cursor:pointer;line-height:1}
.thumb.add{display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--accent);font-size:13px;font-weight:700;border-style:dashed}
.thumb.add b{font-size:28px;line-height:1}
.thumb .ld{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--muted)}

/* 請款單紙本 */
.slip{background:var(--paper);color:var(--paper-ink);border:1px solid var(--paper-line);border-radius:4px;padding:22px 20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 1px 0 var(--paper-line),0 10px 24px -18px rgba(0,0,0,.4)}
.slip .head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:8px;border-bottom:3px double var(--paper-ink);padding-bottom:10px}
.slip .head b{font-family:var(--display);font-weight:900;font-size:24px;letter-spacing:.3em}
.slip .head span{font-size:13px;font-variant-numeric:tabular-nums}
.slip table{width:100%;border-collapse:collapse;font-size:15px}
.slip th{width:7.5em;text-align:left;font-weight:700;color:#4B5C55;padding:8px 10px 8px 0;vertical-align:top;border-bottom:1px solid var(--paper-line);white-space:nowrap}
.slip td{padding:8px 0;border-bottom:1px solid var(--paper-line);overflow-wrap:anywhere}
.slip .big{font-size:22px;font-weight:900;font-variant-numeric:tabular-nums}
.slip .cap{font-size:13px;color:#4B5C55}
.boxes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--paper-ink)}
.boxes > div{border-left:1px solid var(--paper-ink);display:flex;flex-direction:column;min-height:132px}
.boxes > div:first-child{border-left:0}
.boxes h3{margin:0;font-size:13px;font-weight:700;text-align:center;padding:4px;border-bottom:1px solid var(--paper-ink);letter-spacing:.4em}
.boxes .in{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 6px;gap:4px;text-align:center;font-size:13px}
.boxes .in img{max-height:64px;width:auto;max-width:100%}
.boxes .nm{font-family:var(--display);font-weight:700;font-size:17px}
.boxes .dt{font-size:11px;color:#4B5C55;font-variant-numeric:tabular-nums}
.boxes .stamp{color:#BF3A2B;border:2px solid #BF3A2B;border-radius:4px;padding:2px 8px;font-weight:900;letter-spacing:.2em;transform:rotate(-6deg);font-size:14px}
.boxes .wait{color:#8A949A}
@media (max-width:440px){.boxes h3{letter-spacing:.1em}.boxes .in img{max-height:50px}}
.reject{background:var(--seal-soft);color:var(--seal);border-radius:var(--r);padding:12px 14px;font-size:14px}
.timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted)}
.timeline li{display:grid;grid-template-columns:8.5em minmax(0,1fr);gap:8px}
.timeline span{font-variant-numeric:tabular-nums}

.signbox{position:relative;background:#fff;border:1px dashed var(--paper-line);border-radius:8px;height:180px}
.signbox canvas{width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
.signbox .hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#8A949A;pointer-events:none;font-size:15px}
.signbox.sm{height:120px}
.signbox.tap{width:100%;font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px;color:#5E6B66}
.signbox.tap .hint{position:static;font-size:16px;font-weight:700;color:#2E3F94}
.signbox.tap img{max-height:80px;max-width:100%}
.signbox.tap.done{border-style:solid}
.signbox.tap .redo{font-size:12px;color:#5E6B66;font-weight:400}
.signer{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.signer .sbar{display:flex;align-items:center;gap:8px}
.signer .sbar b{flex:1;text-align:center;font-family:var(--display);font-size:18px}
.signer .sarea{position:relative;flex:1;min-height:0;background:#fff;border-radius:10px;overflow:hidden}
.signer canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
.signer .shint{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#8A949A;font-size:18px;pointer-events:none}
.signer .shint small{font-size:13px;margin-top:6px}
.signer .sline{position:absolute;left:8%;right:8%;bottom:28%;border-bottom:1px dashed #C9D3CE;pointer-events:none}
.padlabel{display:flex;flex-direction:column;gap:8px;font-size:14px;font-weight:700}
.padlabel .hint{font-weight:400;color:var(--muted);font-size:12px}
.sigprev{background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px;display:flex;justify-content:center}
.sigprev img{max-height:70px}

.viewer{position:fixed;inset:0;background:var(--scrim);z-index:50;display:flex;flex-direction:column;padding:calc(12px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.viewer .bar{display:flex;justify-content:flex-end;align-items:center;gap:10px;flex-wrap:wrap}
.viewer .bar .vh{flex:1;color:#fff;font-size:14px;min-width:0}
.viewer .bar a{font:inherit;font-weight:700;background:#D4A23A;color:#1B1A10;border-radius:999px;padding:8px 18px;text-decoration:none}
.viewer .bar button{font:inherit;font-weight:700;background:#fff;color:#14251F;border:0;border-radius:999px;padding:8px 18px;cursor:pointer}
.viewer .img{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;overflow:auto}
.viewer img{max-width:100%;max-height:100%;object-fit:contain}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="signer" id="signer" hidden role="dialog" aria-modal="true" aria-labelledby="signer-title">
  <div class="sbar"><button type="button" class="btn quiet sm" data-act="padCancel">取消</button><b id="signer-title">簽名</b><button type="button" class="btn quiet sm" data-act="padRedo">清除</button><button type="button" class="btn sm" id="signer-done" data-act="padDone" disabled>完成</button></div>
  <div class="sarea"><canvas id="signer-pad" aria-label="簽名板"></canvas><div class="shint" id="signer-hint">用手指在白色區域簽名<br><small>橫拿手機簽起來更順手</small></div><div class="sline"></div></div>
</div>
<div class="viewer" id="viewer" hidden><div class="bar"><span class="vh" id="viewer-hint"></span><a id="viewer-dl" href="#" download hidden>下載圖片</a><button type="button" data-act="closeViewer">關閉</button></div><div class="img"><img id="viewer-img" alt="單據照片"></div></div>

<script>
/* ===== 設定 =====
   正式上線時，把 Apps Script 部署後的網址貼在 API 這裡。
   空白＝樣板模式：資料只存在這台裝置，方便先試用。 */
var API = "https://script.google.com/macros/s/AKfycby2SrjBNoIhUH4Jshf0bJ7I-wfgnHTkgB8v8iHtMamwG9Ob1eP66uTDZkLtS1BU-LAgNA/exec";
var LIVE = !!API;

var CATS = ["進貨貨款","維修工程","租金水電","廣告行銷","設備採購","員工代墊","其他"];
var UNITS = ["總部","鼎山","陽明","後昌","仁雄","凱旋","五店分攤"];
var METHODS = ["匯款","現金"];
var ST = {pending:["等老闆核准","warn"], approved:["已核准・待付款","info"], rejected:["已退回","seal"], paid:["已付款","ok"], withdrawn:["已撤回","muted"]};
var MAX_PHOTOS = 6;

/* ===== 小工具 ===== */
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
function money(n){ n=Math.round(Number(n)||0); return "NT$ "+n.toLocaleString("en-US"); }
function pad(n){ return ("0"+n).slice(-2); }
function today(){ var d=new Date(); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function fmt(t){ if(!t) return ""; var d=new Date(t); return (d.getFullYear()-1911)+"/"+pad(d.getMonth()+1)+"/"+pad(d.getDate())+" "+pad(d.getHours())+":"+pad(d.getMinutes()); }
function fmtD(s){ if(!s) return ""; var p=String(s).split("-"); if(p.length<3) return s; return (Number(p[0])-1911)+"/"+p[1]+"/"+p[2]; }
function $(id){ return document.getElementById(id); }
function val(id){ var e=$(id); return e?String(e.value||"").trim():""; }

/* ===== 本機樣板資料（API 空白時才用）===== */
var LKEY="ym-pay-demo-v1", SKEY="ym-pay-session";
function demoReceipt(title, lines, total){
  try{
    var c=document.createElement("canvas"); c.width=560; c.height=760; var x=c.getContext("2d");
    x.fillStyle="#fbfaf6"; x.fillRect(0,0,560,760);
    x.fillStyle="#222"; x.font="bold 34px sans-serif"; x.textAlign="center"; x.fillText(title,280,70);
    x.font="18px sans-serif"; x.fillText("（範例單據・非真實資料）",280,104);
    x.textAlign="left"; x.font="22px sans-serif";
    var y=170; lines.forEach(function(l){ x.fillText(l[0],50,y); x.textAlign="right"; x.fillText(l[1],510,y); x.textAlign="left"; y+=46; });
    x.strokeStyle="#999"; x.setLineDash([6,6]); x.beginPath(); x.moveTo(40,y); x.lineTo(520,y); x.stroke();
    x.font="bold 28px sans-serif"; x.fillText("合計",50,y+50); x.textAlign="right"; x.fillText(total,510,y+50);
    return c.toDataURL("image/jpeg",.7);
  }catch(e){ return ""; }
}
function seedDB(){
  var now=Date.now(), H=3600e3, D=24*H;
  var db={reqs:[], photos:{}, sigs:{}, sigVer:0, pin:"1234", names:["姚東妍","廖宛如","曾芳新"], seq:{}, fails:0};
  function add(o, img){
    var id="r"+(now-o.ago); var ph=[];
    if(img){ var pid="p"+id; db.photos[pid]=img; ph.push(pid); }

(function(){

function sigImage(){

  for(var y=0;y<h;y+=2) for(var i=0;i<w;i+=2){ if(d[(y*w+i)*4+3]>0){ if(i<x0)x0=i; if(i>x1)x1=i; if(y<y0)y0=y; if(y>y1)y1=y; } }

  var m=10; x0=Math.max(0,x0-m); y0=Math.max(0,y0-m); x1=Math.min(w,x1+m); y1=Math.min(h,y1+m);
  var cw=x1-x0, ch=y1-y0, k=Math.min(1, 420/cw, 160/ch), o=document.createElement("canvas"); o.width=Math.max(1,Math.round(cw*k)); o.height=Math.max(1,Math.round(ch*k));
  o.getContext("2d").drawImage(c,x0,y0,cw,ch,0,0,o.width,o.height); return o.toDataURL("image/png");
}

/* ===== 按鈕 ===== */
document.addEventListener("click",function(ev){
  var t=ev.target.closest("[data-act]"); if(!t) return;
  var act=t.getAttribute("data-act"), v=t.getAttribute("data-v");
  if(act==="view"){ if(S.view===v) return; saveForm(); S.view=v; S.detail=null; S.msg=""; S.act=null; S.loaded=false; S.reqs=[]; keep(); if(v==="apply") startApply(); else if(S.pin) load(); else render(); }
  else if(act==="code"){ var c=val("lg-code"); if(!c) return; S.code=c; S.msg=""; api("init",{code:c}).then(function(j){ S.names=j.names||[]; keep(); load(); }, function(e){ S.msg=errText(e); render(); }); }
    else if(act==="logout"){ S.code=""; S.names=[]; S.reqs=[]; S.loaded=false; S.detail=null; keep(); render(); }
  else if(act==="tab"){ saveForm(); S.tab=v; S.detail=null; S.act=null; S.msg=""; if(v==="new"&&!S.form) S.form=blankForm(); render(); window.scrollTo(0,0); }
  else if(act==="filter"){ S.filter=v; render(); }
  else if(act==="reload"){ S.msg=""; load(); }
  else if(act==="open"){ saveForm(); delete PADS["pay-sig"]; S.detail=t.getAttribute("data-id"); S.act=null; S.msg=""; render(); window.scrollTo(0,0); }
  else if(act==="back"){ S.detail=null; S.act=null; S.msg=""; render(); }
  else if(act==="method"){ saveForm(); S.form.method=v; render(); }
  else if(act==="rmPhoto"){ ev.preventDefault(); saveForm(); S.form.photos.splice(Number(t.getAttribute("data-i")),1); render(); }
  else if(act==="cancelEdit"){ S.form=blankForm(); delete PADS["f-sig"]; S.tab="list"; render(); }
  else if(act==="submit") submitForm();
  else if(act==="viewPhoto"){ var src=S.photoCache[t.getAttribute("data-id")]; if(src) openViewer(src,"","",""); }
  else if(act==="slipImg"){ slipImage(); }
  else if(act==="closeViewer"){ closeViewer(); }
  else if(act==="withdraw"){ S.act="withdraw"; render(); }
  else if(act==="actNone"){ S.act=null; render(); }
  else if(act==="withdrawYes"){ var r0=reqById(S.detail); api("withdraw",{code:S.code, me:r0.by, id:r0.id}).then(function(j){ upsert(j.req); S.act=null; render(); }, failReload); }
  else if(act==="edit"){ var r1=reqById(S.detail); S.form={editId:r1.id, ver:r1.ver, by:r1.by, cat:r1.cat, unit:r1.unit, payee:r1.payee, amount:String(r1.amount), method:r1.method, bank:r1.bank, acct:r1.acct, holder:r1.holder, purpose:r1.purpose, due:r1.due, urgent:r1.urgent, photos:r1.photos.map(function(id){return {id:id};})};
    delete PADS["f-sig"]; S.detail=null; S.tab="new"; render(); window.scrollTo(0,0); }
  else if(act==="pay"){ var r2=reqById(S.detail), pb=val("pay-by"), pd=val("pay-date")||today(), pn=val("pay-note"); var pm=$("pay-msg"); if(!pb){ pm.hidden=false; pm.textContent="請選付款登記人。"; return; } if(!padInked("pay-sig")){ pm.hidden=false; pm.textContent="請付款人簽名。"; return; } var ps=padImg("pay-sig"); if(S.busy) return; S.busy=true; S.lastBy=pb; keep(); render();
    api("pay",{code:S.code, me:pb, id:r2.id, date:pd, note:pn, sig:ps}).then(function(j){ S.busy=false; delete PADS["pay-sig"]; upsert(j.req); render(); }, function(e){ S.busy=false; failReload(e); }); }
  else if(act==="gmLogin"){ var p=val("gm-pin"); if(!p||S.busy) return; S.busy=true; S.msg=""; render();
    api("gmCheck",{pin:p}).then(function(j){ S.busy=false; S.pin=p; S.hasSig=!!j.hasSig; render(); if(S.hasSig) load(); }, function(e){ S.busy=false; S.msg=errText(e); render(); }); }
  else if(act==="bossOut"){ S.pin=""; S.detail=null; S.reqs=[]; S.loaded=false; S.boss={tab:"todo"}; render(); }
  else if(act==="btab"){ S.boss.tab=v; render(); }
  else if(act==="bossMenu"){ S.boss.menu=!S.boss.menu; render(); }
  else if(act==="sigChange"){ S.boss.sigMode=true; S.boss.menu=false; render(); }
  else if(act==="sigCancel"){ S.boss.sigMode=false; render(); }
  else if(act==="sigClear"){ delete PADS["sigpad"]; render(); }
  else if(act==="padOpen"){ padOpen(v, t.getAttribute("data-t")); }
  else if(act==="padCancel"){ padClose(); }
  else if(act==="padRedo"){ sizePad(); }
  else if(act==="padDone"){ var im=sigImage(); if(!im) return; PADS[SG.id]={img:im}; padClose(); render(); var bx=$(SG.id); if(bx) bx.scrollIntoView({block:"center"}); }
  else if(act==="sigSave"){ var img=padImg("sigpad"); if(!img) return; t.disabled=true; t.textContent="儲存中…";
    api("gmSig",{pin:S.pin, sig:img}).then(function(j){ S.hasSig=true; S.boss.sigMode=false; S.msg=""; delete PADS["sigpad"]; S.sigs[j.sigVer]=img; load(); }, function(e){ S.msg=errText(e); render(); }); }
  else if(act==="pinChange"){ var a=val("pin-new"), b=val("pin-new2"), m=$("pin-msg");
    function say(s,ok){ m.hidden=false; m.className=ok?"okmsg":"err"; m.textContent=s; }
    if(!/^\d{4,8}$/.test(a)) return say("密碼請輸入 4 到 8 位數字。"); if(a!==b) return say("兩次輸入的不一樣。");
    api("gmPin",{pin:S.pin, newPin:a}).then(function(){ S.pin=a; $("pin-new").value=""; $("pin-new2").value=""; say("密碼已更換，下次用新密碼進入。",true); }, function(e){ say(errText(e)); }); }
  else if(act==="approve"){ var r3=reqById(S.detail); if(S.busy) return; S.busy="approve"; var note=val("ap-note"); render();
    api("gmApprove",{pin:S.pin, id:r3.id, ver:r3.ver, note:note}).then(function(j){ S.busy=false; upsert(j.req); render(); }, function(e){ S.busy=false; failReload(e); }); }
  else if(act==="reject"){ var r4=reqById(S.detail), why=val("rj-reason"); if(!why){ var rm=$("rj-msg"); rm.hidden=false; rm.textContent=ERR.reason; return; } if(S.busy) return; S.busy="reject"; render();
    api("gmReject",{pin:S.pin, id:r4.id, ver:r4.ver, reason:why}).then(function(j){ S.busy=false; upsert(j.req); render(); }, function(e){ S.busy=false; failReload(e); }); }
});
document.addEventListener("keydown",function(e){ if(e.key==="Escape" && !$("viewer").hidden) closeViewer();
  if(e.key==="Enter"){ if(e.target.id==="gm-pin"){ var b=$("btn-gm"); if(b) b.click(); } if(e.target.id==="lg-code"){ var c=$("btn-code"); if(c) c.click(); } } });
function failReload(e){ S.msg=errText(e); load(); }
function submitForm(){
  if(S.busy) return; saveForm(); var f=S.form, m=$("f-msg");
  var amt=Number(String(f.amount).replace(/[,，\s]/g,""));
  var miss=[]; if(!f.by) miss.push("申請人"); if(!f.cat) miss.push("請款類別"); if(!f.payee) miss.push("受款對象"); if(!(amt>0)) miss.push("金額"); if(!f.purpose) miss.push("用途說明");
  if(f.method==="匯款"){ if(!f.bank) miss.push("銀行"); if(!f.acct) miss.push("帳號"); if(!f.holder) miss.push("戶名"); }
  if(!padInked("f-sig")) miss.push("申請人簽名");
  if(miss.length){ m.hidden=false; m.textContent="還沒填："+miss.join("、"); m.scrollIntoView({block:"center"}); return; }
  var req={cat:f.cat, unit:f.unit, payee:f.payee, amount:Math.round(amt), method:f.method, bank:f.bank, acct:f.acct, holder:f.holder, purpose:f.purpose, due:f.due, urgent:f.urgent};
  var fresh=f.photos.filter(function(p){return p.data;}).map(function(p){return p.data;}), kept=f.photos.filter(function(p){return p.id;}).map(function(p){return p.id;});
  req.bySig=padImg("f-sig");
  S.busy=true; render();
  var call=f.editId? api("resubmit",{code:S.code, me:f.by, id:f.editId, ver:f.ver, req:req, keep:kept, photos:fresh}) : api("submit",{code:S.code, me:f.by, req:req, photos:fresh});
  S.lastBy=f.by; keep();
  call.then(function(j){ S.busy=false; upsert(j.req); fresh.forEach(function(u,i){ var pid=j.req.photos[kept.length+i]; if(pid) S.photoCache[pid]=u; });
      S.form=blankForm(); delete PADS["f-sig"]; S.tab="list"; S.detail=j.req.id; S.msg=""; render(); window.scrollTo(0,0); },
    function(e){ S.busy=false; render(); var mm=$("f-msg"); if(mm){ mm.hidden=false; mm.textContent=errText(e); } });
}

/* ===== 請款單存成圖片 ===== */
var dlUrl="";
function openViewer(src,hint,dl,name){
  $("viewer-img").src=src; $("viewer-hint").textContent=hint||"";
  var a=$("viewer-dl"); if(dl){ a.href=dl; a.setAttribute("download",name||"請款單.png"); a.hidden=false; } else a.hidden=true;
  $("viewer").hidden=false;
}
function closeViewer(){ $("viewer").hidden=true; if(dlUrl){ try{ URL.revokeObjectURL(dlUrl); }catch(e){} dlUrl=""; } }
function loadH2C(){
  if(window.html2canvas) return Promise.resolve();
  return new Promise(function(res,rej){ var sc=document.createElement("script"); sc.src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"; sc.onload=function(){ res(); }; sc.onerror=function(){ rej(new Error("load")); }; document.head.appendChild(sc); });
}
function slipImage(){
  var r=reqById(S.detail), el=document.querySelector(".slip"); if(!r||!el||S.imgBusy) return;
  S.imgBusy=true; var b=$("btn-img"); if(b) b.innerHTML='<span class="spin"></span> 產生中…';
  function done(){ S.imgBusy=false; var b2=$("btn-img"); if(b2) b2.textContent="存成圖片"; }
  loadH2C().then(function(){ return window.html2canvas(el,{scale:2, backgroundColor:"#FFFFFF", useCORS:true, logging:false}); })
    .then(function(cv){
      var name="請款單_"+r.no+"_"+String(r.payee).replace(/[\\/:*?"<>|\s]+/g,"").slice(0,20)+".png", url=cv.toDataURL("image/png");
      cv.toBlob(function(bl){
        if(bl){ try{ dlUrl=URL.createObjectURL(bl); }catch(e){ dlUrl=""; } }
        openViewer(url, "手機：長按圖片可以存到相簿或傳 LINE", dlUrl||url, name); done();
      },"image/png");
    }, function(){ done(); S.msg="圖片產生失敗，請檢查網路後再試一次。"; render(); });
}

/* 啟動 */
function startApply(){
  if(!LIVE){ S.names=ldb().names; return load(); }
  if(!S.code) return render();
  if(S.names.length) return load();
  api("init",{code:S.code}).then(function(j){ S.names=j.names||[]; load(); }, function(e){ S.code=""; keep(); S.msg=errText(e); render(); });
}
if(!LIVE){ S.names=ldb().names; }
if(S.view==="apply") startApply(); else render();
</script>
